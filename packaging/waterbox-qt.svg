<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#64B5F6;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <!-- 圆角矩形背景 -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="url(#bg)"/>
  <!-- 水波纹装饰 -->
  <path d="M8,180 Q72,160 128,175 Q184,190 248,170 L248,248 Q248,248 200,248 L56,248 Q8,248 8,200 Z" fill="url(#wave)"/>
  <path d="M8,200 Q72,185 128,195 Q184,205 248,190 L248,248 Q248,248 200,248 L56,248 Q8,248 8,200 Z" fill="url(#wave)"/>
  <!-- "智" 字 -->
  <text x="128" y="148" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, SimHei, STHeiti, sans-serif" font-size="130" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">智</text>
</svg>
